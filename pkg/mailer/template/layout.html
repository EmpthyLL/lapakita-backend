<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{block "title" .}}Lapakita Platform{{end}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #0f172a;
      }
      .email-container {
        max-width: 520px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 25px -5px rgba(6, 87, 189, 0.08);
      }
      .header-accent {
        height: 5px;
        background: linear-gradient(
          100deg,
          #0657bd 0%,
          #0d9488 55%,
          #2be576 100%
        );
      }
      .header {
        padding: 32px 28px 20px;
        text-align: center;
        background-color: #ffffff;
      }
      .brand-title-gradient {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0;
        color: #0657bd;
      }
      .brand-logo {
        height: 44px;
        max-width: 200px;
        object-fit: contain;
      }
      .content {
        padding: 24px 32px 36px;
      }
      .content-center {
        text-align: center;
      }
      .content-left {
        text-align: left;
      }
      .greeting {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 12px;
      }
      .description {
        font-size: 15px;
        color: #475569;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      /* ─── OTP CARD STYLING (3-Color Brand Gradient + Teks Putih Solid) ─── */
      .otp-card {
        background: linear-gradient(
          135deg,
          #0657bd 0%,
          #0d9488 55%,
          #10b981 100%
        );
        border-radius: 14px;
        padding: 28px 20px;
        margin: 0 auto 28px;
        max-width: 340px;
        text-align: center;
        box-shadow: 0 8px 20px -4px rgba(6, 87, 189, 0.25);
      }
      .otp-code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 10px;
        font-family: ui-monospace, "SF Mono", "Courier New", monospace;
        color: #ffffff !important; /* Putih Solid Kontras */
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
      }
      .badge-expiry {
        display: inline-block;
        background-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 14px;
        border-radius: 9999px;
        margin-top: 14px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(4px);
      }

      /* ─── CONTACT & PARTNERSHIP STYLING ─── */
      .partner-badge {
        display: inline-block;
        background-color: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        font-size: 12px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 9999px;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .inquiry-card {
        background-color: #f8fafc;
        border-left: 4px solid #0657bd;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 28px;
      }
      .inquiry-card.partner-card {
        border-left-color: #2be576;
        background-color: #f0fdf4;
      }
      .inquiry-field {
        font-size: 11px;
        color: #94a3b8;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .inquiry-val {
        font-size: 14px;
        color: #1e293b;
        font-weight: 600;
        margin-bottom: 14px;
      }
      .inquiry-val:last-child {
        margin-bottom: 0;
      }

      .footer {
        background-color: #f8fafc;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: #94a3b8;
        border-top: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header-accent"></div>
      <div class="header">
        {{if .LogoCID}}
        <img src="cid:{{.LogoCID}}" alt="Lapakita" class="brand-logo" />
        {{else}}
        <h1 class="brand-title-gradient">LAPAKITA</h1>
        {{end}}
      </div>

      {{template "content" .}}

      <div class="footer">
        &copy; 2026 Lapakita Platform. All rights reserved.<br />
        This is an automated message, please do not reply.
      </div>
    </div>
  </body>
</html>
