version: "3.8"

services:
  # app:
  #   build: .
  #   ports:
  #     - "${APP_PORT}:${APP_PORT}"
  #   environment:
  #     - DB_HOST=postgres
  #   depends_on:
  #     - postgres
  #   restart: always

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always

  # minio:
  #   image: ghcr.io/minio/minio:latest
  #   container_name: minio_storage
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
  #     MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
  #   volumes:
  #     - minio_data:/data
  #   command: server /data --console-address ":9001"
  #   restart: always
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_storage
    ports:
      - "8333:8333" # S3 API Port
      - "9333:9333" # Master Server Port
    command: >
      server
      -s3
      -s3.port=8333
      -dir=/data
    volumes:
      - seaweed_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
  # minio_data:
  seaweed_data:
